<ng-container *ngIf="viewModel$ | async as viewModel; else loading">
  <div class="container my-2">
    <app-hello name="{{ name }}"></app-hello>
    <p>
      Very simple NgRx starter app. Used in this medium article :
      <a
        href="https://medium.com/@coco.boudard/starting-with-angular-and-ngrx-store-75e92c90d346">
        Starting with Angular and NgRx Store
      </a>
    </p>
    <div class="mb-2">
      <button class="btn btn-success btn-sm me-2" (click)="decrement()">
        Decrement
      </button>
      <button class="btn btn-success btn-sm me-2" (click)="increment()">
        Increment
      </button>
      <button
        class="btn btn-primary btn-sm me-2"
        [disabled]="viewModel.isStoring"
        (click)="storeVal(viewModel.count)">
        Store
      </button>
      <span
        *ngIf="viewModel.isStoring"
        class="text-primary"
        role="status"
        aria-live="polite">
        <span
          class="spinner-border spinner-border-sm me-1"
          aria-hidden="true"></span>
        Saving...
      </span>
      <span *ngIf="viewModel.storeError" class="text-danger ms-2" role="alert">
        Could not save the counter. Try again.
      </span>
    </div>
    <div class="mb-2">
      counter:
      <span
        class="badge bg-primary"
        id="num"
        [innerText]="viewModel.count"></span>
    </div>
    <div class="mb-2">
      storage:
      <span
        *ngIf="viewModel.storageError; else storedValue"
        class="text-danger">
        Saved value unavailable.
      </span>
      <ng-template #storedValue>
        <span
          class="badge bg-info"
          id="storage"
          [innerText]="viewModel.storedValue"></span>
      </ng-template>
    </div>
    <app-counter-explanation></app-counter-explanation>
    <div ngbDropdown class="d-inline-block">
      <button
        type="button"
        class="btn btn-outline-primary"
        id="dropdownBasic1"
        ngbDropdownToggle>
        Toggle dropdown
      </button>
      <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
        <button ngbDropdownItem>Action - 1</button>
        <button ngbDropdownItem>Another Action</button>
        <button ngbDropdownItem>Something else is here</button>
      </div>
    </div>
  </div>
</ng-container>
<ng-template #loading>
  <div class="container my-2" role="status" aria-live="polite">
    <div
      class="spinner-border spinner-border-sm text-primary me-2"
      aria-hidden="true"></div>
    <span>Loading counter values...</span>
  </div>
</ng-template>
